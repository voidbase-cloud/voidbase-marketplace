# Publish a plugin version by hand: a repository and a ref, through the same pipeline an approval runs. For a new
# version of a listed plugin, or to re-run one that failed. A published version is never overwritten.
name: bundle
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/name of a listed plugin"
        required: true
        type: string
      ref:
        description: "branch, tag or commit; the default branch when empty"
        required: false
        type: string
        default: ""

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build, audit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/bundle.ts "${{ inputs.repository }}" ${{ inputs.ref }}
      - name: Commit the release
        run: |
          git config user.name "voidbase-marketplace"
          git config user.email "noreply@voidbase.cloud"
          git add registry
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "feat(registry): bundle ${{ inputs.repository }}"
          git push
