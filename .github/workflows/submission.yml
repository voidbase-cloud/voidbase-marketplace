# Two things happen to a submission issue, and both of them are here.
#
# When it is opened or edited, the form is read, the rules are checked and a template is audited, and one comment
# says what a maintainer would otherwise have to work out by hand. Nothing is approved automatically.
#
# When a maintainer adds the `approved` label, the issue becomes an entry in registry/*.json and is committed. The
# audit is run again rather than trusted from the earlier comment, because the repository can change in between.
name: submission
on:
  issues:
    types: [opened, edited, labeled, reopened]

# One run at a time: an approval commits to master, and two approvals labelled within seconds of each other raced on
# the push (the second was rejected and its listing lost until the label was re-applied). The group covers every
# run, so a validation waits behind a listing rather than racing it.
concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: >-
      contains(github.event.issue.labels.*.name, 'submission') &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Read the form, check it, audit a template
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/validate.ts
      - name: Say what it found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file comment.md

  approve:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Add it to the registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/approve.ts
      - name: Build, audit and publish the plugin's bundle
        if: contains(github.event.issue.labels.*.name, 'plugin')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/bundle.ts --from-issue
      - name: Commit the listing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "voidbase-marketplace"
          git config user.email "noreply@voidbase.cloud"
          git add registry
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "feat(registry): list from #${{ github.event.issue.number }}"
          git push
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Listed. It appears on https://marketplace.voidbase.cloud when the next deploy finishes."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
