# Track the voidbase release: every hour, if npm has a newer @voidbase-cloud/voidbase than package.json pins, bump
# to it and push, and the connected Cloudflare build deploys it. The testbeds run the latest release on purpose: a
# regression is meant to show up here first, not in someone else's project.
name: track-voidbase
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Bump to the latest release when behind
        id: bump
        run: |
          latest=$(npm view @voidbase-cloud/voidbase version)
          pinned=$(jq -r .dependencies[@voidbase-cloud/voidbase] package.json)
          echo "pinned $pinned, latest $latest"
          if [ "$pinned" = "$latest" ]; then echo "up to date"; exit 0; fi
          bun add --exact "@voidbase-cloud/voidbase@$latest"
          git config user.name "voidbase-bot"
          git config user.email "noreply@voidbase.cloud"
          git add package.json bun.lock
          git commit -m "chore(deps): voidbase $latest"
          git push
          echo "bumped=1" >> "$GITHUB_OUTPUT"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
